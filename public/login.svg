<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
  <!-- The student chat's sign-in picture: the mark, the name and what REINS
       stands for. Everything sits in the middle (x 170-730, y 290-800), which
       stays in view however the page crops the picture. -->
  <rect width="900" height="1200" fill="#1d2227"/>
  <g fill="none" stroke="#3a424a" stroke-width="2">
    <path d="M0 900h900M0 980h900M0 1060h900M0 1140h900"/>
  </g>
  <g transform="translate(338 290) scale(3.5)">
    <rect width="64" height="64" rx="12" fill="#f2b705"/>
    <path d="M16 46 32 18 48 46" fill="none" stroke="#1d2227" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Assistant, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" text-anchor="middle">
    <text x="450" y="640" font-size="84" font-weight="700" fill="#eef0f2">REINS Edu</text>
    <text x="450" y="728" font-size="40" fill="#b4bcc4"><tspan font-weight="800" fill="#f2b705">R</tspan>eviewed <tspan font-weight="800" fill="#f2b705">E</tspan>xplanations,</text>
    <text x="450" y="782" font-size="40" fill="#b4bcc4"><tspan font-weight="800" fill="#f2b705">I</tspan>nstructor-<tspan font-weight="800" fill="#f2b705">N</tspan>avigated <tspan font-weight="800" fill="#f2b705">S</tspan>teps</text>
  </g>
</svg>
